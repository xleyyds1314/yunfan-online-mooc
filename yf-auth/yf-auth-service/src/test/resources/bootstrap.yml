server:
  port: 8081  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: auth-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
            refresh: false
          - data-id: shared-redis.yaml # 共享redis配置
            refresh: false
          - data-id: shared-mybatis.yaml # 共享mybatis配置
            refresh: false
          - data-id: shared-logs.yaml # 共享日志配置
            refresh: false
          - data-id: shared-mq.yaml # 共享mq配置
            refresh: false
          - data-id: shared-rocketmq.yaml # 共享加密配置
            refresh: false
encrypt:
  key-store:
    alias: yfxt  #别名
    location: classpath:yfxt.jks  #KeyStore 证书库名称
    password: tj123321   #证书库密码
    secret: tj123321   #秘钥
yf:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.yunfan.auth.controller
    title: 云帆学堂 - 权限微服务接口文档
    description: 该服务用于管理权限相关信息
    contact-name: 云帆学堂
    contact-url: https://www.yunfan.com/
    contact-email: xleyyds1314@users.noreply.github.com
    version: v1.0
  auth:
    resource:
      enable: true
      includeLoginPaths:
        - /menus/me
        - /accounts/logout
  jdbc:
    database: yf_auth