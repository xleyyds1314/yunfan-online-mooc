server:
  port: 8087  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
  error:
    include-message: always #返回的响应体带上message
spring:
  profiles:
    active: dev
  application:
    name: pay-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - dataId: shared-spring.yaml # 共享spring配置
          - dataId: shared-redis.yaml # 共享redis配置
          - dataId: shared-mybatis.yaml # 共享mybatis配置
          - dataId: shared-logs.yaml # 共享日志配置
          - dataId: shared-feign.yaml # 共享feign配置
          - dataId: shared-mq.yaml # 共享mq配置
          - dataId: shared-xxljob.yaml # 共享mq配置
yf:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.yunfan.pay.controller
    title: 云帆学堂 - 支付中心接口文档
    description: 该服务提供微信、支付宝等各种平台的支付、退款等功能
    contact-name: 云帆学堂
    contact-url: https://www.yunfan.com/
    contact-email: xleyyds1314@users.noreply.github.com
    version: v1.0
  jdbc:
    database: yf_pay
  pay:
    notifyHost: https://6b9f16dd.r2.cpolar.top/ps
    ali:
      appId:
      merchantPrivateKey:
      publicKey:
    wx:
      appId:
      mchId:
      mchSerialNo:
      privateKey:
      apiV3Key:
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - /refund-orders/**