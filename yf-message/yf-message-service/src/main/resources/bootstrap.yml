server:
  port: 8085  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: message-service
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
            refresh: false
          - data-id: shared-redis.yaml # 共享redis配置
            refresh: false
          - data-id: shared-mybatis.yaml # 共享mybatis配置
            refresh: false
          - data-id: shared-logs.yaml # 共享日志配置
            refresh: false
          - data-id: shared-feign.yaml # 共享feign配置
            refresh: false
          - data-id: shared-mq.yaml # 共享mq配置
            refresh: false
          - data-id: shared-xxljob.yaml
            refresh: false
          - data-id: shared-rocketmq.yaml # 共享加密配置
            refresh: false
yf:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.yunfan.message.controller
    title: 云帆学堂 - 消息中心接口文档
    description: 该服务用于站内信、通知管理、短信发送等功能
    contact-name: 云帆学堂
    contact-url: https://www.yunfan.com/
    contact-email: xleyyds1314@users.noreply.github.com
    version: v1.0
  auth:
    resource:
      enable: true
      excludeLoginPaths:
        - /students/register
  jdbc:
    database: yf_message
  sms:
    ali:
      accessId: xxx
      accessSecret: xxx
