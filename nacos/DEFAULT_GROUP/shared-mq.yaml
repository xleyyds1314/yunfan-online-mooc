spring:
  rabbitmq:
    host: ${yf.mq.host:127.0.0.1}
    port: ${yf.mq.port:5672}
    virtual-host: ${yf.mq.vhost:/}
    username: ${yf.mq.username:guest}
    password: ${yf.mq.password:guest}
    listener:
      simple:
        retry:
          enabled: ${yf.mq.listener.retry.enable:true} # 开启消费者失败重试
          initial-interval: ${yf.mq.listener.retry.interval:1000ms} # 初始的失败等待时长为1秒
          multiplier: ${yf.mq.listener.retry.multiplier:2} # 失败的等待时长倍数，下次等待时长 = multiplier * last-interval
          max-attempts: ${yf.mq.listener.retry.max-attempts:3} # 最大重试次数
          stateless: ${yf.mq.listener.retry.stateless:true} # true无状态；false有状态。如果业务中包含事务，这里改为false