server:
  port: 8093  #端口
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  profiles:
    active: dev
  application:
    name: data-service
  influx:
    url: http://192.168.150.101:8006
    #    password: 123456
    #    user: admin
    mapper-location: com.yunfan.data.influxdb.mapper
  cloud:
    nacos:
      config:
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: shared-spring.yaml # 共享spring配置
            refresh: false
          - data-id: shared-redis.yaml # 共享redis配置
            refresh: false
          - data-id: shared-mybatis.yaml # 共享mybatis配置
            refresh: false
          - data-id: shared-logs.yaml # 共享日志配置
            refresh: false
          - data-id: shared-feign.yaml # 共享feign配置
            refresh: false
          - data-id: shared-mq.yaml # 共享mq配置
            refresh: false
          - data-id: shared-xxljob.yaml # 共享job配置
            refresh: false
#          - data-id: shared-influxdb.yaml # 共享job配置
#            refresh: false
yf:
  swagger:
    enable: true
    enableResponseWrap: true
    package-path: com.yunfan.data.controller
    title: 云帆学堂 - 数据中心接口文档
    description: 该服务包含数据看板统计的功能
    contact-name: 云帆学堂
    contact-url: https://www.yunfan.com/
    contact-email: xleyyds1314@users.noreply.github.com
    version: v1.0
  jdbc:
    database: yf_data
  auth:
    resource:
      enable: true
